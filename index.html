<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141311">
<title>Stackline — Train. Track. Progress.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE7; --surface:#FBF9F4; --surface2:#ECE7DC; --sunken:#E7E1D4;
  --ink:#211E18; --muted:#6F6759; --faint:#9B9384;
  --line:#DCD5C6; --line2:#CFC7B6;
  --teal:#0E7C6E; --teal-strong:#0A5F54; --teal-soft:rgba(14,124,110,.10); --teal-mid:rgba(14,124,110,.22);
  --amber:#A9622B; --amber-soft:rgba(169,98,43,.12);
  --red:#A8402F;
  --figure:#C9C1B0;
  --shadow:0 1px 2px rgba(33,30,24,.06),0 8px 24px -12px rgba(33,30,24,.18);
  --shadow-lg:0 2px 4px rgba(33,30,24,.07),0 18px 44px -16px rgba(33,30,24,.28);
  --r:16px; --r-sm:11px;
}
[data-theme="dark"]{
  --bg:#141311; --surface:#1D1B18; --surface2:#26231E; --sunken:#0F0E0C;
  --ink:#EDE9E0; --muted:#9C947F; --faint:#6E6759;
  --line:#312D26; --line2:#3E392F;
  --teal:#33C2AD; --teal-strong:#5AD6C3; --teal-soft:rgba(51,194,173,.10); --teal-mid:rgba(51,194,173,.24);
  --amber:#D89A5B; --amber-soft:rgba(216,154,91,.12);
  --red:#E07862;
  --figure:#4A4539;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 22px 52px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",system-ui,sans-serif;
  line-height:1.45; min-height:100dvh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  transition:background .25s,color .25s;
  overscroll-behavior-y:contain;
}
::selection{background:var(--teal-mid)}
h1,h2,h3,.disp{font-family:"Archivo",system-ui,sans-serif;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
svg{display:block}

/* ---------- shell ---------- */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:26px;height:26px}
.brand b{font-family:"Archivo";font-weight:800;font-size:1rem;letter-spacing:.02em}
.brand small{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:-2px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:transform .15s,color .15s;
}
.iconbtn:active{transform:scale(.92)}
main{max-width:640px;margin:0 auto;padding:16px 16px 8px}
@media(min-width:700px){ main{max-width:600px} }
.view{display:none;animation:rise .3s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
nav.tabs button{
  flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 5px;border-radius:12px;color:var(--faint);
  font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  transition:color .15s;
}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.on{color:var(--teal)}
nav.tabs button:active{transform:scale(.94)}

/* ---------- primitives ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);
}
.card+.card{margin-top:12px}
.eyebrow{
  font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow.teal{color:var(--teal)}
.h-lg{font-size:1.5rem;font-weight:800;line-height:1.15;margin:6px 0 2px}
.h-md{font-size:1.05rem;font-weight:700}
.sub{color:var(--muted);font-size:.85rem}
.tiny{color:var(--faint);font-size:.72rem}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{margin-top:22px}
.sec>.eyebrow{margin-bottom:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:13px;font-weight:600;font-size:.88rem;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink);
  transition:transform .12s,filter .15s;min-height:44px;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 18px -8px var(--teal)}
[data-theme="dark"] .btn.primary{color:#0E1B18}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:.78rem;min-height:36px;border-radius:11px}
.btn.block{width:100%}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn svg{width:16px;height:16px}

.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:.76rem;font-weight:600;color:var(--muted);
  transition:all .15s;white-space:nowrap;min-height:34px;
}
.chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.chiprow::-webkit-scrollbar{display:none}

.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;
  font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line);
}
.tag.teal{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.tag.amber{background:var(--amber-soft);color:var(--amber);border-color:transparent}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600}
.kv span{color:var(--muted);text-align:right}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);font-size:.9rem;outline:none;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--teal);outline-offset:2px;
}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
label.f:first-child{margin-top:0}

/* sliders */
.slider{display:flex;align-items:center;gap:12px}
.slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--line2);outline:none}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:var(--shadow);cursor:pointer}
.slider .val{font-family:"Archivo";font-weight:800;font-size:1.25rem;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- today ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(150deg,var(--surface) 0%,var(--surface2) 100%);
  padding:20px 18px 18px;box-shadow:var(--shadow-lg);
}
.hero .angle{position:absolute;right:-14px;top:-14px;width:150px;height:150px;opacity:.9;pointer-events:none}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px}
.stat .n{font-family:"Archivo";font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.quick .btn{flex-direction:column;gap:5px;padding:12px 6px;font-size:.68rem;min-height:64px}
.quick .btn svg{width:19px;height:19px}

/* exercise / routine items */
.exl{display:flex;flex-direction:column;gap:9px}
.exi{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;
  transition:transform .12s;
}
.exi:active{transform:scale(.985)}
.exi .ic{
  width:40px;height:40px;border-radius:11px;background:var(--teal-soft);
  display:grid;place-items:center;color:var(--teal);flex:none;font-family:"Archivo";font-weight:800;font-size:.8rem;
}
.exi .bd{flex:1;min-width:0}
.exi .nm{font-weight:600;font-size:.9rem}
.exi .mt{font-size:.72rem;color:var(--muted);margin-top:1px}
.exi .fav{color:var(--faint);padding:6px}
.exi .fav.on{color:var(--amber)}
.check{
  width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);flex:none;
  display:grid;place-items:center;color:transparent;transition:all .15s;
}
.check.on{background:var(--teal);border-color:var(--teal);color:#fff}
[data-theme="dark"] .check.on{color:#0E1B18}
.exi.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}

/* week */
.dayc{display:flex;gap:13px;align-items:stretch}
.dayc .rail{display:flex;flex-direction:column;align-items:center;width:38px;flex:none}
.dayc .dd{font-family:"Archivo";font-weight:800;font-size:.78rem;letter-spacing:.08em;color:var(--muted)}
.dayc.today .dd{color:var(--teal)}
.dayc .dot{width:9px;height:9px;border-radius:50%;background:var(--line2);margin:5px 0 2px}
.dayc.today .dot{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.dayc .stem{flex:1;width:2px;background:var(--line);border-radius:2px}
.dayc .card{flex:1;margin-bottom:12px}

/* modal */
.scrim{
  position:fixed;inset:0;z-index:90;background:rgba(15,13,10,.5);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:95;max-height:92dvh;
  background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.35,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 0;flex:none}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet .sbody{overflow-y:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet .sfoot{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
@media(min-width:560px){.sheet{max-width:560px;margin:0 auto}}

/* charts */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.chart .cttl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;gap:12px;font-size:.68rem;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.media-opt{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface2);margin-top:8px;
}
.media-opt.pref{border-color:var(--teal);background:var(--teal-soft)}
.media-opt .mic{width:34px;height:34px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.media-opt.pref .mic{color:var(--teal)}
.media-opt .bd{flex:1;min-width:0}
.media-opt .bd b{font-size:.82rem;display:block}
.media-opt .bd span{font-size:.68rem;color:var(--muted)}
.media-opt a{color:var(--teal);font-size:.74rem;font-weight:700;text-decoration:none;padding:8px}

.gaugewrap{display:flex;align-items:center;gap:16px}
.notice{
  display:flex;gap:10px;padding:11px 13px;border-radius:12px;font-size:.8rem;
  background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
  align-items:flex-start;margin-top:12px;
}
.notice.teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-mid)}
.notice svg{width:16px;height:16px;flex:none;margin-top:1px}

.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty svg{width:38px;height:38px;margin:0 auto 10px;color:var(--faint)}
.searchbar{position:relative;margin-bottom:12px}
.searchbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.searchbar input{padding-left:38px}
.count-pill{background:var(--teal);color:#fff;font-size:.62rem;font-weight:800;border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
[data-theme="dark"] .count-pill{color:#0E1B18}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface2)}
.stepper button{width:38px;height:40px;font-size:1.1rem;color:var(--muted);font-weight:700}
.stepper input{width:44px;text-align:center;border:none;background:transparent;padding:8px 0;font-weight:700;font-variant-numeric:tabular-nums}
/* ---- drill video block ---- */
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;transition:background .2s}
.syncdot.on{background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.syncdot.busy{background:var(--amber);animation:pulse 1s infinite}
.syncdot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.acct{display:flex;align-items:center;gap:11px;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);margin-bottom:12px}
.acct .av{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:"Archivo";font-weight:800;flex:none}
.acct .bd{flex:1;min-width:0}
.acct .bd b{display:block;font-size:.86rem}
.acct .bd span{font-size:.7rem;color:var(--muted);word-break:break-all}

.swapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.swaplbl{text-align:center;font-size:.63rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.swapopt{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:11px 8px;cursor:pointer;text-align:center;min-height:70px;
  display:flex;flex-direction:column;justify-content:center;gap:3px;transition:all .15s}
.swapopt.on{border-color:var(--teal);background:var(--teal-soft)}
.swapopt.empty{opacity:.45;cursor:default;border-style:dashed}
.swapopt .nm{font-size:.75rem;font-weight:600;line-height:1.25}
.swapopt .lv{font-size:.58rem;color:var(--faint);font-weight:700}

.keybox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.keybox .desc{font-size:.93rem;line-height:1.55;margin-bottom:12px}
.keyhd{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:10px}
.keyline{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.87rem}
.keyline:last-child{border-bottom:none}
.keyline b{min-width:62px;font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}
.keyline span{flex:1}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:11px;font-size:.89rem;line-height:1.5}
ol.steps li:last-child{margin-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:7px;
  background:var(--teal-soft);color:var(--teal);font-family:"Archivo";font-weight:800;font-size:.72rem;display:grid;place-items:center}
ol.steps li.warn{color:var(--amber)}
ol.steps li.warn::before{background:var(--amber-soft);color:var(--amber);content:"!"}
ul.bul{padding-left:18px;font-size:.85rem;line-height:1.6}
.acc{border:1px solid var(--line);border-radius:13px;margin-top:9px;background:var(--surface);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:none;border:0;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.acc>button .t{flex:1;font-size:.82rem;font-weight:600}
.acc>button .n{font-size:.66rem;color:var(--faint);font-weight:700}
.acc>button>svg{width:15px;height:15px;color:var(--faint);transition:transform .2s;flex:none}
.acc.open>button>svg{transform:rotate(180deg)}
.acc .ic{width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.acc .ic svg{width:14px;height:14px}
.acc .inner{display:none;padding:0 14px 14px}
.acc.open .inner{display:block}
.navrow{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface2);cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.navrow .dir{font-size:.57rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;flex:none}
.navrow .dir.up{background:var(--teal-soft);color:var(--teal)}
.navrow .dir.down{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.navrow .bd{flex:1;min-width:0}
.navrow .bd b{display:block;font-size:.83rem;font-weight:600}
.navrow .bd i{display:block;font-style:normal;font-size:.7rem;color:var(--muted);margin-top:1px}
.navrow svg{width:15px;height:15px;color:var(--faint);flex:none}
.navrow[data-go="none"]{opacity:.6;cursor:default}

.cllist{display:flex;flex-direction:column;gap:10px}
.clitem{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.clitem .nm{font-weight:600;font-size:.87rem}

/* ---- Today v3: ambient tint, date strip, hero card, recently-used ---- */
/* Applied directly to body's own background instead of a fixed overlay —
   body already paints an opaque --bg, and with no ancestor establishing a
   stacking context the z-index:-1 overlay trick was unreliable. This way
   the tint IS the background, so there's nothing for it to lose to. */
/* Strengthened: cards cover most of a phone screen, so a subtle wash was
   invisible in practice. Bigger reach, taller, and using the stronger --mid
   colour twice (once fully opaque near the top, fading out) instead of
   fading immediately, so it is visible in the margins around cards too. */
body.tint-skill{background-color:var(--bg);background-image:linear-gradient(180deg, var(--amber-mid) 0%, transparent 55%)}
body.tint-recovery{background-color:var(--bg);background-image:linear-gradient(180deg, var(--teal-mid) 0%, transparent 55%)}
body.tint-rest{background-color:var(--bg);background-image:none}
/* The highlight box is decoupled from the layout column: .dcell stays
   flex:1 so all seven columns are genuinely equal width, but the visible
   teal background lives on a separate inner element sized only to its own
   content (dow+num+dot). That way the highlight can never stretch beyond
   its content no matter what happens to the outer flex row's height. */
/* Hard ceiling on the highlight box specifically, rather than relying on
   the layout to naturally hug its content — three previous attempts at the
   structural fix didn't resolve a persistent over-tall render, so this caps
   it directly: it cannot visually stretch past this height regardless of
   what is causing the stretch, full stop. */
.datestrip{display:flex;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:6px 3px;box-shadow:var(--shadow);gap:1px}
.dcell{flex:1 1 0;min-width:0;max-width:14%;display:block;
  padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;height:auto}
.dcell-inner{display:block;width:fit-content;max-width:100%;margin:0 auto;
  max-height:38px;overflow:hidden;padding:3px 7px;border-radius:7px;
  text-align:center;box-sizing:border-box}
.dcell.today .dcell-inner{background:var(--teal-soft)}
.dcell .dow{display:block;font-size:.5rem;color:var(--faint);font-weight:700;text-transform:uppercase;line-height:1.1}
.dcell .num{display:block;font-family:"Archivo";font-size:.82rem;font-weight:800;margin-top:0;color:var(--ink);line-height:1.1}
.dcell.today .num{color:var(--teal)}
.dcell .dot{display:block;width:3px;height:3px;border-radius:50%;background:var(--teal);margin:2px auto 0}
.dcell .dot.empty{background:transparent}
.hero{position:relative;border-radius:22px;padding:18px;box-shadow:var(--shadow-lg);overflow:hidden;margin-top:10px;
  background:linear-gradient(135deg,var(--amber-mid) 0%,var(--surface) 65%);border:1px solid var(--amber-mid)}
.hero.recovery{background:linear-gradient(135deg,var(--teal-mid) 0%,var(--surface) 65%);border-color:var(--teal-mid)}
.hero.restday{background:var(--surface);border-color:var(--line)}
.hero .figs{position:absolute;right:10px;bottom:10px;width:92px;display:flex;gap:2px;opacity:.8;pointer-events:none;z-index:1}
.hero .figs svg{height:100%;width:auto}
.hero .hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hero .hero-top .day{background:rgba(0,0,0,.24);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,.14);padding:3px 9px;border-radius:8px;color:#fff}
[data-theme="dark"] .hero .hero-top .day{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.1)}
.hero .day{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.hero.recovery .day{color:var(--teal)}
.hero .dur{background:rgba(0,0,0,.24);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:5px 10px;font-family:"Archivo";font-weight:800;
  font-size:.78rem;color:#fff}
[data-theme="dark"] .hero .dur{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.1)}
.hero h2{font-family:"Archivo";font-size:1.4rem;font-weight:800;margin-top:7px;position:relative;z-index:2;max-width:60%}
.hero .fx{font-size:.8rem;color:var(--muted);margin-top:2px;position:relative;z-index:2;max-width:60%}
.hero .marks{display:flex;align-items:center;gap:3px;margin-top:10px;position:relative;z-index:2}
.hero .marks svg{width:12px;height:12px}
.hero .marks span{font-size:.66rem;font-weight:700;margin-right:4px;color:var(--amber)}
.hero.recovery .marks span{color:var(--teal)}
.hero-cta{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;
  border:0;border-radius:13px;padding:11px 17px;font-weight:700;font-size:.83rem;font-family:inherit;position:relative;z-index:2;cursor:pointer}
[data-theme="dark"] .hero-cta{color:#0E1B18}
.hero-cta svg{width:14px;height:14px}
.scrollrow{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.rchip{flex:none;width:114px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:var(--shadow);cursor:pointer}
.rchip .ic{width:28px;height:28px;border-radius:9px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;margin-bottom:8px}
.rchip .ic svg{width:14px;height:14px}
.rchip .nm{font-size:.76rem;font-weight:700;line-height:1.25}
.rchip .mt{font-size:.63rem;color:var(--faint);margin-top:3px}

.mini-hero{position:relative;border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);overflow:hidden;
  background:linear-gradient(120deg,var(--amber-soft) 0%,var(--surface) 70%);border:1px solid var(--line);
  display:flex;align-items:center;gap:11px;cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left}
.mini-hero .figs{width:38px;height:46px;display:flex;gap:1px;flex:none;opacity:.85;pointer-events:none}
.mini-hero .figs svg{height:100%;width:auto}
.mini-hero .bd{flex:1;min-width:0}
.mini-hero .nm{font-weight:700;font-size:.86rem}
.mini-hero .mt{font-size:.72rem;color:var(--muted);margin-top:1px}
.mini-hero .go{flex:none;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:8px 12px;
  font-weight:700;font-size:.75rem;font-family:inherit;pointer-events:none}
[data-theme="dark"] .mini-hero .go{color:#0E1B18}
.mini-hero .count{position:absolute;top:7px;right:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:2px 7px;font-size:.6rem;font-weight:800;color:var(--teal)}

/* Workout cards — the figure sits as a proper flex sibling of the title,
   confined to the heading area only, so it can never overlap the exercise
   list below it regardless of how many exercises a workout has. */
.wk-hero-flat{border-radius:20px;padding:16px;box-shadow:var(--shadow-lg);margin-bottom:12px;
  background:linear-gradient(135deg,var(--teal-mid) 0%,var(--surface) 55%);border:1px solid var(--teal-mid)}
.wk-hero-flat .hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.wk-hero-flat .tag2{background:rgba(0,0,0,.24);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:3px 9px;
  font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff}
[data-theme="dark"] .wk-hero-flat .tag2{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.1)}
.wk-hero-flat .dur2{background:rgba(0,0,0,.24);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:4px 9px;
  font-family:"Archivo";font-weight:800;font-size:.75rem;color:#fff}
[data-theme="dark"] .wk-hero-flat .dur2{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.1)}
.wk-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.wk-heading .wk-text{flex:1;min-width:0}
.wk-heading h3{font-family:"Archivo";font-size:1.1rem;font-weight:800}
.wk-heading .fx2{font-size:.78rem;color:var(--muted);margin-top:3px}
.wk-heading .figs{flex:none;height:96px;display:flex;gap:3px;opacity:.9;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.wk-heading .figs svg{height:100%;width:auto}

.thead{background:linear-gradient(150deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--line);
  border-radius:20px;padding:18px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.thead .day{font-size:.63rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.thead h2{font-family:"Archivo";font-size:1.45rem;font-weight:800;line-height:1.15;margin:5px 0 3px;padding-right:72px}
.tring{position:absolute;right:16px;top:16px;width:62px;height:62px}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tring b{font-family:"Archivo";font-size:.98rem;font-weight:800;line-height:1}
.tring span{font-size:.48rem;color:var(--faint);font-weight:700;letter-spacing:.06em}
.streakpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:.74rem;font-weight:600;color:var(--ink);font-family:inherit}
.streakpill b{font-family:"Archivo";font-weight:800;color:var(--teal)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);
  cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .12s;
  display:flex;flex-direction:column;align-items:flex-start;height:100%}
.ccard:active{transform:scale(.985)}
.ccard .figs{display:flex;gap:4px;justify-content:center;align-items:flex-end;background:var(--surface2);
  border-radius:11px;padding:8px 4px;margin-bottom:9px;flex:none;width:100%}
.ccard h3{font-family:"Archivo";font-size:.95rem;font-weight:800;line-height:1.2}
.ccard .n{font-size:.69rem;color:var(--muted);margin-top:2px}
.ccard .subs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.ccard .subs span{font-size:.55rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  background:var(--surface2);color:var(--muted);border-radius:5px;padding:2px 5px}
.cathead{display:flex;gap:12px;align-items:center;margin-top:12px}
.cathead .figs{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:8px}
.cathead h2{font-family:"Archivo";font-size:1.25rem;font-weight:800}
.backbar{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--teal);font:inherit;
  font-size:.82rem;font-weight:700;cursor:pointer;padding:4px 0}
.backbar svg{width:15px;height:15px}
.exi.ref{opacity:.78;background:var(--surface2)}

.filtertoggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;font-size:.83rem;
  font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:8px}
.filtertoggle svg{width:15px;height:15px;color:var(--faint);transition:transform .2s}
.filterbox.open ~ .filtertoggle svg,.filtertoggle.open svg{transform:rotate(180deg)}
.filterbox{display:none;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.filterbox.open{display:block}
.filterbox .grouprow+.grouprow{margin-top:13px}

.wdrow{display:flex;gap:6px;margin-top:12px}
.wd{flex:1;text-align:center}
.wd span{display:block;font-size:.6rem;color:var(--faint);font-weight:700;margin-bottom:4px}
.wd i{display:block;height:6px;border-radius:3px;background:var(--line)}
.wd.on i{background:var(--teal)}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0}
.bar .bl{font-size:.8rem;width:38%;color:var(--muted)}
.bar .bt{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--teal);border-radius:4px}
.bar b{font-size:.76rem;font-variant-numeric:tabular-nums;min-width:18px;text-align:right}

.segrow{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg{flex:1;padding:9px;border-radius:9px;border:0;background:none;font:inherit;font-size:.83rem;font-weight:600;
  color:var(--muted);cursor:pointer}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grouprow{margin-bottom:2px}
.glabel{display:block;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}

.feelrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel{background:var(--surface2);border:2px solid var(--line);border-radius:13px;padding:12px 8px;cursor:pointer;
  font:inherit;color:var(--ink);text-align:center;transition:all .15s}
.feel.on{border-color:var(--teal);background:var(--teal-soft)}
.feel b{display:block;font-size:.86rem;font-weight:700}
.feel span{display:block;font-size:.66rem;color:var(--muted);margin-top:3px;line-height:1.3}

.tlist{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;cursor:pointer;transition:transform .12s;box-shadow:var(--shadow);
  width:100%;font:inherit;color:var(--ink);text-align:left}
.trow:active{transform:scale(.99)}
.trow.done{background:var(--surface2);box-shadow:none}
.trow.done .nm{color:var(--muted)}
.trow.primary{border-color:var(--teal);background:linear-gradient(140deg,var(--teal-soft),var(--surface))}
.trow .mark{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;
  border:2px solid var(--line2);color:var(--teal)}
.trow .mark.on{background:var(--teal);border-color:var(--teal);color:#fff}
[data-theme="dark"] .trow .mark.on{color:#0E1B18}
.trow .mark svg{width:15px;height:15px}
.trow .mark.opt{border-style:dashed;color:var(--faint)}
.trow .bd{flex:1;min-width:0}
.trow .bd .nm{font-weight:600;font-size:.91rem}
.trow .bd .mt{font-size:.74rem;color:var(--muted);margin-top:1px}
.trow .go{font-size:.72rem;font-weight:700;color:var(--teal);flex:none;display:flex;align-items:center;gap:3px}
.trow .go svg{width:13px;height:13px}
.trow.done .go{color:var(--faint)}
.ladder{display:flex;gap:5px;margin-top:11px}
.ladder i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ladder i.done{background:var(--teal);opacity:.55}
.ladder i.now{background:var(--teal)}
.stg{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.stg:last-child{border-bottom:none}
.stgn{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:"Archivo";font-weight:800;font-size:.76rem;background:var(--surface2);color:var(--faint)}
.stg.done .stgn{background:var(--teal-soft);color:var(--teal)}
.stg.now .stgn{background:var(--teal);color:#fff}
[data-theme="dark"] .stg.now .stgn{color:#0E1B18}
.stg.todo{opacity:.6}
.stg.tried{opacity:.85}
.stg.tried .stgn{background:var(--amber-soft);color:var(--amber)}
.stgb{flex:1;min-width:0}
.stgb b{font-size:.89rem}

.musclebox{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px}
.mmviews{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mmviews>div{background:var(--surface);border-radius:11px;padding:6px;min-height:150px}
.mmviews svg{width:100%;height:auto;display:block}
.mmlegend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:.68rem;color:var(--muted);font-weight:600}
.mmlegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tag.work{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.tag.len{background:var(--amber-soft);color:var(--amber);border-color:transparent}

.vidwrap{margin-bottom:16px}
.vidbox{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);aspect-ratio:16/9}
.vidbox img{width:100%;height:100%;object-fit:cover;display:block}
.vidbox iframe{width:100%;height:100%;border:0;display:block}
.vidplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.42))}
.vidplay i{width:58px;height:58px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.55);transition:transform .15s}
.vidplay:active i{transform:scale(.92)}
.vidplay svg{width:24px;height:24px;margin-left:3px;fill:#fff}
[data-theme="dark"] .vidplay svg{fill:#0E1B18}
.vidstamp{position:absolute;left:9px;bottom:9px;background:rgba(10,9,7,.82);color:#fff;font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:7px}
.vidflag{position:absolute;right:9px;top:9px;background:var(--amber);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.vidbox .vidph{position:absolute;inset:0;display:grid;place-items:center;padding:18px;
  background:linear-gradient(145deg,var(--surface2),var(--sunken));}
.vidbox .vidph-in{text-align:center;color:var(--muted);max-width:88%}
.vidbox .vidph-in svg{width:26px;height:26px;margin:0 auto 8px;color:var(--faint)}
.vidbox .vidph-in b{display:block;color:var(--ink);font-size:.9rem;font-weight:700;margin-bottom:3px}
.vidbox .vidph-in span{font-size:.72rem;color:var(--faint)}
.vidbox.blocked .vidplay{background:transparent}
.vidbox.blocked .vidplay i{width:46px;height:46px;opacity:.95}

.vidmissing{display:flex;gap:11px;align-items:flex-start;padding:14px;border-radius:14px;border:1px dashed var(--line2);background:var(--surface2);color:var(--muted)}
.vidmissing svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--faint)}
.vidmissing b{color:var(--ink);font-size:.88rem}

.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:120;white-space:nowrap;box-shadow:var(--shadow-lg);
}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
